# render.yaml
services:
  - type: web
    name: kuravote
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn kuravote.wsgi:application --config gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DATABASE_URL
        fromDatabase:
          name: kuravote-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: VAPID_PRIVATE_KEY
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        generateValue: true
      - key: VAPID_EMAIL
        value: admin@kuravote.com

databases:
  - name: kuravote-db
    plan: free
    databaseName: kuravote_db
    user: kuravote_user