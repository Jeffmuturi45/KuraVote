{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuraVote — Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      background: #fff;
      border-radius: 18px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .form-control {
      border-color: #d1fae5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
    }
    .form-control:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
    }
    .btn-login {
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #15803d; }
    .errornote {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #991b1b;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-box">

    <div class="text-center mb-4">
      <div style="font-family:'Sora',sans-serif; font-size:2rem;
                  font-weight:700; color:#166534; margin-bottom:4px;">
        Kura<span style="color:#eab308">Vote</span>
      </div>
      <div style="font-size:0.8rem; color:#94a3b8;">
        Administrator Access
      </div>
    </div>

    {% if form.errors %}
      <div class="errornote">
        <i class="fa fa-exclamation-circle me-1"></i>
        Invalid username or password.
      </div>
    {% endif %}

    <form method="POST" action="{{ request.path }}" id="admin-login">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label style="font-size:13px; font-weight:500;
                      color:#374151; display:block; margin-bottom:6px;">
          <i class="fa fa-user me-1" style="color:#16a34a;"></i>
          Username
        </label>
        <input type="text"
               name="username"
               class="form-control"
               autofocus
               required>
      </div>

      <div class="mb-4">
        <label style="font-size:13px; font-weight:500;
                      color:#374151; display:block; margin-bottom:6px;">
          <i class="fa fa-lock me-1" style="color:#16a34a;"></i>
          Password
        </label>
        <input type="password"
               name="password"
               class="form-control"
               required>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        <i class="fa fa-sign-in-alt me-2"></i>
        Login to Admin Panel
      </button>

    </form>

    <div class="text-center mt-4">
      <a href="{% url 'login' %}"
         style="font-size:12px; color:#94a3b8; text-decoration:none;">
        <i class="fa fa-arrow-left me-1"></i>
        Back to student login
      </a>
    </div>

  </div>

  <script>
    const form = document.getElementById('admin-login');
    const btn  = document.getElementById('login-btn');
    form.addEventListener('submit', function() {
      btn.disabled  = true;
      btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>'
        + 'Logging in...';
    });
  </script>
</body>
</html>
