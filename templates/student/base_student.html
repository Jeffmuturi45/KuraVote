{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="student-shell">

  <!-- ── Top Navbar ── -->
  <nav class="student-navbar d-flex align-items-center
              justify-content-between px-3 py-2">

    <div style="font-family:'Sora',sans-serif; font-weight:700;
                font-size:1.1rem; color:#fff;">
      Kura<span style="color:#eab308">Vote</span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <!-- Student chip -->
      <div style="background:rgba(255,255,255,0.12);
                  border-radius:20px; padding:4px 12px;
                  font-size:0.75rem; color:#fff;
                  display:flex; align-items:center; gap:5px;">
        <i class="fa fa-user-circle" style="font-size:12px"></i>
        Adm: {{ request.user.admission_number }}
      </div>

      <!-- Logout -->
      <a href="{% url 'logout' %}"
         style="color:rgba(255,255,255,0.6); font-size:13px;
                text-decoration:none;"
         title="Logout">
        <i class="fa fa-sign-out-alt"></i>
      </a>
    </div>
  </nav>

  <!-- ── Page Content ── -->
  <div class="student-content content-pad">
    {% block student_content %}{% endblock %}
  </div>

  <!-- ── Bottom Navigation ── -->
  <nav class="student-bottom-nav">

    <a href="{% url 'student_dashboard' %}"
       class="bottom-nav-item
       {% block nav_dashboard %}{% endblock %}">
      <i class="fa fa-home"></i>
      <span>Home</span>
    </a>

    <a href="{% url 'ballot' %}"
       class="bottom-nav-item
       {% block nav_ballot %}{% endblock %}">
      <i class="fa fa-vote-yea"></i>
      <span>Vote</span>
    </a>

    <a href="{% url 'student_results' %}"
       class="bottom-nav-item
       {% block nav_results %}{% endblock %}">
      <i class="fa fa-chart-bar"></i>
      <span>Results</span>
    </a>

    <a href="{% url 'student_profile' %}"
       class="bottom-nav-item
       {% block nav_profile %}{% endblock %}">
      <i class="fa fa-user"></i>
      <span>Profile</span>
    </a>

  </nav>

</div>
{% endblock %}
